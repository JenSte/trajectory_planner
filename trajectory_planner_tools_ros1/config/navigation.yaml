global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 0.1
  static_map: true
  footprint: "[[0.17, 0.0], [0.13, 0.18], [-0.19, 0.18], [-0.26, 0], [-0.19, -0.18], [0.13, -0.18]]"
  #  plugins: []

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  #static_map: false
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  plugins: []
  footprint: "[[0.17, 0.0], [0.13, 0.17], [-0.19, 0.17], [-0.26, 0], [-0.19, -0.17], [0.13, -0.17]]"

base_global_planner: "trajectory_planner/TrajectoryPlanner"

# Configuration of the global planner.
TrajectoryPlanner:
  # cost_map_3d_type: "linear"
  cost_map_3d_type: "exponential"

  orientation_costs_3d_type: "identical"
  # orientation_costs_3d_type: "footprint"

  angle_granularity: 120
  inscribed_radius: 0.3
  inflation_radius: 2.5
  cache_directory: "/tmp"
  debug_directory: "/tmp"

  # The coordinate of an "internal" point on the map, everything not connected
  # via free space is removed from the map (optional).
  #internal_point_x: 2.0
  #internal_point_y: 3.0

  # The maximum velocity of a wheel of the vehicle, in m/s.
  maximum_wheel_velocity: 1.0

  # The maximum acceleration of a wheel of the vehicle, in m/(s^2).
  maximum_wheel_acceleration: 1.0

  # The distance between the two driving wheels of the vehicle, in m.
  wheel_distance: 0.34

  linear_velocity_steps: 5
  angular_velocity_steps: 5

  inflation_5d_radius: 0.10
  inflation_5d_lookahead: 0.5
  heuristic: "depth"

# Comment "in" to use the DWA planner. The default is the "Trajectory Rollout" planner
# (base_local_planner::TrajectoryPlanner) (which somehow also implements DWA).
#base_local_planner: "dwa_local_planner/DWAPlannerROS"

recovery_behavior_enabled: false

# Configuration of the local planner.
#
# Both the "normal" base_local_planner and the dwa_local_planner implement similar
# approaches, share some or have very similar parameters, and their documentation
# is quite confusing/seems outdated. The block below contains all the configuration
# parameters for both planners merged together, taken from their respective wiki
# pages and sorted, so that similar looking parameters appear next to each other.
# Comment out/in the "TrajectoryPlannerROS"/"DWAPlannerROS" key (and also change the
# value of "base_local_planner" above) to switch between the local planners.
#
# tp:  https://wiki.ros.org/base_local_planner
# dwa: https://wiki.ros.org/dwa_local_planner
TrajectoryPlannerROS:
#DWAPlannerROS:

  #
  # Robot Configuration Parameters
  #

  # tp dwa: The x acceleration limit of the robot in meters/sec^2
  acc_lim_x: 1.0 # Max. forward acceleration?

  # tp dwa: The y acceleration limit of the robot in meters/sec^2
  acc_lim_y: 0.0 # Max. sideward acceleration?

  # tp:     The rotational acceleration limit of the robot in radians/sec^2
  acc_lim_theta: 5.8
  #    dwa: The rotational acceleration limit of the robot in radians/sec^2
  acc_lim_th:    5.8

  # tp:     The maximum forward velocity allowed for the base in meters/sec
  #    dwa: The maximum x velocity for the robot in m/s.
  max_vel_x:     1.0
  #    dwa: The absolute value of the maximum translational velocity for the robot in m/s
  max_vel_trans: 1.0

  #    dwa: The maximum y velocity for the robot in m/s
  max_vel_y: 0.01

  #    dwa: The minimum y velocity for the robot in m/s
  min_vel_y: -0.01

  # tp:     The minimum forward velocity allowed for the base in meters/sec.
  #    dwa:     The minimum x velocity for the robot in m/s, negative for backwards motion.
  min_vel_x:     0.1
  #    dwa: The absolute value of the minimum translational velocity for the robot in m/s.
  min_vel_trans: 0.1

  # tp:     The maximum rotational velocity allowed for the base in radians/sec
  max_vel_theta: 5.8
  #    dwa: The absolute value of the maximum rotational velocity for the robot in rad/s
  max_rot_vel:   5.8

  # tp:     The minimum rotational velocity allowed for the base in radians/sec
  min_vel_theta: -5.8

  # tp:     The minimum rotational velocity allowed for the base while performing in-place rotations in radians/sec
  min_in_place_vel_theta: 1.0
  #    dwa: The absolute value of the minimum rotational velocity for the robot in rad/s
  min_rot_vel:            1.0

  # tp:     Determines whether velocity commands are generated for a holonomic or non-holonomic robot.
  holonomic_robot: false

  #
  # Goal Tolerance Parameters
  #

  # tp dwa: The tolerance in radians for the controller in yaw/rotation when achieving its goal
  yaw_goal_tolerance: 0.05

  # tp dwa: The tolerance in meters for the controller in the x & y distance when achieving a goal
  xy_goal_tolerance: 0.01

  #
  # Trajectory Scoring Parameters
  #

  # tp:     Whether to use the Dynamic Window Approach (DWA)_ or whether to use Trajectory Rollout
  dwa: true

  sim_time: 1.0
  pdist_scale: 5.0
