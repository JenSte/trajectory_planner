global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 0.1
  static_map: true
  #  plugins: []

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  #static_map: false
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  plugins: []

base_global_planner: "trajectory_planner/TrajectoryPlanner"

TrajectoryPlanner:
  angle_granularity: 120
  inflation_radius: 2.5
  cache_directory: "/tmp"
  debug_directory: "/tmp"

  inflation_5d_radius: 0.10
  inflation_5d_lookahead: 0.5
  linear_velocity_maximum: 0.5
  angular_velocity_maximum: 0.5
  simulation_time_delta: 0.1
  linear_velocity_steps: 5
  angular_velocity_steps: 5
  heuristic: "depth"
