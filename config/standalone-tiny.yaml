# /opt/ros/galactic/share/nav2_bringup/params/nav2_params.yaml

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["trajectory_planner"]
    trajectory_planner:
      plugin: "trajectory_planner/TrajectoryPlanner"

      angle_granularity: 360
      inflation_radius: 0.1
      inflation_5d_radius: 0.04
      inflation_5d_lookahead: 0.10
      cache_directory: "/tmp"
      debug_directory: "/tmp"
      linear_velocity_maximum: 0.5
      angular_velocity_maximum: 1.0
      simulation_time_delta: 0.1
      heuristic: "depth"

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.001
      footprint: "[[-0.025, 0.025], [0.045, 0.025], [0.045, -0.025], [-0.025, -0.025]]"
